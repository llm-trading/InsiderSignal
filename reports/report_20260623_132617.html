<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insider Signal Report - June 23, 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #0c0c0e; 
            color: #d4d4d8; 
            margin: 0; 
            padding: 0; 
        }
        * { font-style: normal !important; }
        
        .signal-table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .signal-table th {
            background: #18181b;
            padding: 12px 16px;
            text-align: left;
            font-weight: 800;
            text-transform: uppercase;
            font-size: 10px;
            letter-spacing: 0.1em;
            color: #71717a;
            border-bottom: 2px solid #27272a;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        
        .signal-table td {
            padding: 12px 16px;
            border-bottom: 1px solid #27272a;
            vertical-align: top;
        }
        
        .signal-table tbody tr {
            transition: background-color 0.2s;
        }
        
        .signal-table tbody tr:hover {
            background: #18181b;
        }
        
        .ticker-icon {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 14px;
            margin-right: 12px;
        }
        
        .signal-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        .signal-strong-buy {
            background: #065f46;
            color: #d1fae5;
            border: 1px solid #10b981;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.3);
        }
        
        .signal-buy {
            background: #1e3a8a;
            color: #dbeafe;
            border: 1px solid #3b82f6;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.3);
        }
        
        .signal-weak {
            background: #3f3f46;
            color: #d4d4d8;
            border: 1px solid #52525b;
        }
        
        .signal-noise {
            background: #7f1d1d;
            color: #fecaca;
            border: 1px solid #dc2626;
            box-shadow: 0 0 20px rgba(220, 38, 38, 0.3);
        }
        
        .factor-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        
        .factor-list li {
            padding: 4px 0;
            font-size: 12px;
            line-height: 1.5;
        }
        
        .factor-list li:before {
            content: "•";
            margin-right: 8px;
            font-weight: 900;
        }
        
        .goods li:before {
            color: #10b981;
        }
        
        .bads li:before {
            color: #ef4444;
        }
        
        .filter-btn {
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .filter-btn:hover {
            transform: translateY(-1px);
        }
        
        .filter-btn.active {
            border-color: currentColor;
        }
        
        .filter-all {
            background: #27272a;
            color: #d4d4d8;
        }
        
        .filter-strong-buy {
            background: #065f46;
            color: #d1fae5;
        }
        
        .filter-buy {
            background: #1e3a8a;
            color: #dbeafe;
        }
        
        .filter-weak {
            background: #3f3f46;
            color: #d4d4d8;
        }
        
        .filter-noise {
            background: #7f1d1d;
            color: #fecaca;
        }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0c0c0e; }
        ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 10px; }
    </style>
</head>
<body class="p-4 md:p-6">
    <div class="max-w-7xl mx-auto">
        <header class="mb-8">
            <div class="space-y-3">
                <h1 class="text-3xl font-black text-white tracking-tighter uppercase leading-none">
                    Insider Signal Intelligence
                </h1>
                <div id="live-clock" class="text-sm font-bold text-zinc-400">
                    Loading...
                </div>
                <div id="data-timestamp" class="text-xs text-zinc-600" data-timestamp="2026-06-23T13:26:17">
                    Data Generated: Loading...
                </div>
            </div>
        </header>

        <div class="mb-6 flex flex-wrap gap-3">
            <button class="filter-btn filter-all active" onclick="filterSignals('all')" data-filter="all">
                All (0)
            </button>
            <button class="filter-btn filter-strong-buy" onclick="filterSignals('STRONG_BUY_SIGNAL')" data-filter="STRONG_BUY_SIGNAL">
                Strong Buy (0)
            </button>
            <button class="filter-btn filter-buy" onclick="filterSignals('BUY_SIGNAL')" data-filter="BUY_SIGNAL">
                Buy (0)
            </button>
            <button class="filter-btn filter-weak" onclick="filterSignals('WEAK_SIGNAL')" data-filter="WEAK_SIGNAL">
                Weak (0)
            </button>
            <button class="filter-btn filter-noise" onclick="filterSignals('NOISE')" data-filter="NOISE">
                Noise (0)
            </button>
        </div>

        <div class="bg-zinc-900/10 border border-zinc-800 rounded-xl overflow-hidden shadow-2xl">
            <div class="overflow-x-auto max-h-[70vh]">
                <table class="signal-table">
                    <thead>
                        <tr>
                            <th style="width: 200px;">Entity</th>
                            <th style="width: 150px;">Latest Activity</th>
                            <th style="width: 180px;">Signal & Score</th>
                            <th style="width: 300px;">Positive Factors</th>
                            <th style="width: 300px;">Risk Factors</th>
                        </tr>
                    </thead>
                    <tbody>

                    </tbody>
                </table>
            </div>
        </div>

        <footer class="mt-6 text-center text-zinc-600 text-xs">
            <p>Generated from insider trading data • Signals are for informational purposes only</p>
        </footer>
    </div>

    <script>
        // Check if market is open
        function isMarketOpen() {
            const now = new Date();
            const etTime = new Date(now.toLocaleString('en-US', {timeZone: 'America/New_York'}));
            
            const day = etTime.getDay(); // 0=Sunday, 6=Saturday
            const hour = etTime.getHours();
            const minute = etTime.getMinutes();
            const timeInMinutes = hour * 60 + minute;
            
            // Market hours: Mon-Fri, 9:30 AM - 4:00 PM ET
            const marketOpen = 9 * 60 + 30;  // 9:30 AM
            const marketClose = 16 * 60;      // 4:00 PM
            
            const isWeekday = day >= 1 && day <= 5;
            const isDuringHours = timeInMinutes >= marketOpen && timeInMinutes < marketClose;
            
            return isWeekday && isDuringHours;
        }
        
        // Update live clock
        function updateLiveClock() {
            const now = new Date();
            
            // Format ET time
            const options = {
                timeZone: 'America/New_York',
                month: 'short',
                day: '2-digit',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: true
            };
            
            const etTime = now.toLocaleString('en-US', options);
            
            // Check market status
            const marketOpen = isMarketOpen();
            const statusDot = marketOpen ? '🟢' : '🔴';
            const statusText = marketOpen ? 
                '<span style="color: #10b981;">Market Open</span>' : 
                '<span style="color: #ef4444;">Market Closed</span>';
            
            document.getElementById('live-clock').innerHTML = 
                `${statusDot} LIVE • ${etTime} ET • ${statusText}`;
        }
        
        // Update data timestamp
        function updateDataTimestamp() {
            const timestampEl = document.getElementById('data-timestamp');
            const timestamp = timestampEl.dataset.timestamp;
            
            if (timestamp) {
                try {
                    const dt = new Date(timestamp);
                    const options = {
                        timeZone: 'America/New_York',
                        month: 'short',
                        day: '2-digit',
                        year: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit',
                        hour12: true
                    };
                    const etTime = dt.toLocaleString('en-US', options);
                    timestampEl.textContent = `Data Generated: ${etTime} ET`;
                } catch (e) {
                    timestampEl.textContent = 'Data Generated: ' + timestamp;
                }
            }
        }
        
        // Filter signals
        function filterSignals(signal) {
            const rows = document.querySelectorAll('.signal-table tbody tr');
            const buttons = document.querySelectorAll('.filter-btn');
            
            // Update active button
            buttons.forEach(btn => {
                if (btn.dataset.filter === signal) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
            
            // Filter rows
            rows.forEach(row => {
                if (signal === 'all' || row.dataset.signal === signal) {
                    row.style.display = '';
                } else {
                    row.style.display = 'none';
                }
            });
        }
        
        // Initialize on page load
        updateLiveClock();
        updateDataTimestamp();
        
        // Update clock every second
        setInterval(updateLiveClock, 1000);
    </script>
</body>
</html>
